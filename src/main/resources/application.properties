# ============================================================================
# Content pipeline configuration
# ============================================================================

# Root directory containing the Markdown source documents.
pipeline.source-dir=data/sources

# Directory where built products and immutable versions are persisted.
pipeline.output-dir=data/output

# Maximum number of products kept in the in-memory build cache (LRU).
pipeline.cache-max-entries=1000

# Maximum number of published versions kept in history. Older versions are
# archived and their product files garbage-collected.
pipeline.version-retention=30

# How to handle references to non-existent documents.
#   ERROR - fail the build (default)
#   WARN  - collect a warning, render the link as external, continue
pipeline.missing-ref-policy=ERROR

# Server port (0 = random port, useful for tests).
server.port=8080
