server.port=0

# ---- Markdown content pipeline configuration ----
# Root directory of markdown sources (relative to the working directory).
content.pipeline.source-dir=content
# File suffix treated as a source document.
content.pipeline.source-suffix=.md
# Policy for include cycles: FAIL | BREAK | BOUNDED
content.pipeline.cycle-policy=FAIL
# Policy for missing references: FAIL | PLACEHOLDER | IGNORE
content.pipeline.missing-ref-policy=FAIL
# Maximum include expansion depth (used by the BOUNDED cycle policy and as a
# hard safety bound for deeply nested includes).
content.pipeline.max-include-depth=16
# Number of published versions kept for query and rollback (including current).
content.pipeline.max-versions=10
# Maximum number of cached rendered artifacts (LRU, bounded memory).
content.pipeline.cache-size=1024
# Bump when the renderer changes; invalidates every content id and cache key.
content.pipeline.renderer-version=1
# Run a full build synchronously during application startup.
content.pipeline.build-on-startup=true
